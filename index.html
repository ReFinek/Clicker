<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Memory Game</title>
<style>
  :root {
    --bg-gradient: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    --gap: 6px;
    --card-font: clamp(1.2rem, 3.5vw, 2rem);
    --radius: 12px;
    --sidebar-width: 240px;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    min-height: 100dvh;
    overflow-x: hidden;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: var(--bg-gradient);
    color: #fff;
    padding: max(10px, env(safe-area-inset-top)) 
             max(10px, env(safe-area-inset-right)) 
             max(10px, env(safe-area-inset-bottom)) 
             max(10px, env(safe-area-inset-left));
    -webkit-text-size-adjust: 100%;
    -webkit-tap-highlight-color: transparent;
  }

  .wrapper {
    display: flex;
    gap: 25px;
    max-width: 1100px;
    width: 100%;
    margin: 0 auto;
    align-items: flex-start;
  }

  .game-section {
    flex: 1;
    min-width: 0; /* Фикс flex-переполнения */
    display: flex;
    flex-direction: column;
    align-items: flex-start;
  }

  h1 {
    font-size: 1.8rem;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }

  .stats {
    display: flex;
    gap: 15px;
    margin-bottom: 12px;
    font-size: 0.95rem;
    flex-wrap: wrap;
  }

  .stats span {
    background: rgba(255,255,255,0.1);
    padding: 6px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255,255,255,0.15);
    backdrop-filter: blur(4px);
  }

  .stats span b { color: #f9d423; }

  .board {
    display: grid;
    grid-template-columns: repeat(8, minmax(0, 1fr));
    grid-template-rows: repeat(7, 1fr);
    gap: var(--gap);
    width: 100%;
    max-width: 740px;
    perspective: 1000px;
    touch-action: manipulation;
  }

  .card {
    aspect-ratio: 1;
    cursor: pointer;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.4s ease;
    border-radius: var(--radius);
    -webkit-tap-highlight-color: transparent;
  }

  .card.flipped { transform: rotateY(180deg); }
  .card.matched {
    transform: rotateY(180deg);
    pointer-events: none;
    animation: matchPop 0.4s ease;
  }
  .card.matched .card-front {
    background: linear-gradient(135deg, #11998e, #38ef7d);
    box-shadow: 0 0 10px rgba(56, 239, 125, 0.3);
    border-color: rgba(255,255,255,0.4);
  }

  .card-front, .card-back {
    position: absolute;
    width: 100%; height: 100%;
    backface-visibility: hidden;
    border-radius: var(--radius);
    display: flex; align-items: center; justify-content: center;
    font-size: var(--card-font);
    user-select: none;
  }

  .card-back {
    background: linear-gradient(145deg, #3a3a6e, #2a2a5e);
    border: 2px solid rgba(255,255,255,0.15);
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
    transition: border-color 0.2s, box-shadow 0.2s;
  }
  .card-back::after {
    content: '?';
    font-size: 0.75em;
    color: rgba(255,255,255,0.25);
    font-weight: bold;
  }

  .card:not(.flipped):not(.matched):hover .card-back,
  .card:not(.flipped):not(.matched):active .card-back {
    border-color: rgba(249, 212, 35, 0.4);
    box-shadow: 0 4px 12px rgba(249, 212, 35, 0.15);
  }

  .card-front {
    background: linear-gradient(145deg, #4a4a8a, #3a3a7a);
    border: 2px solid rgba(255,255,255,0.2);
    transform: rotateY(180deg);
    box-shadow: 0 3px 8px rgba(0,0,0,0.2);
  }

  .sidebar {
    width: var(--sidebar-width);
    flex-shrink: 0;
    background: rgba(255,255,255,0.05);
    border-radius: 16px;
    padding: 18px;
    border: 1px solid rgba(255,255,255,0.1);
    backdrop-filter: blur(6px);
    display: flex; flex-direction: column; gap: 14px;
    height: fit-content;
    min-width: 0;
  }

  .sidebar h2 {
    font-size: 1.1rem; text-align: center; margin: 0 0 6px;
    padding-bottom: 6px; border-bottom: 1px solid rgba(255,255,255,0.1);
  }

  #leaderboard {
    list-style: none; display: flex; flex-direction: column; gap: 6px;
  }

  #leaderboard li {
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,255,255,0.05); padding: 7px 10px;
    border-radius: 8px; font-size: 0.9rem;
  }
  #leaderboard li:nth-child(1) { border-left: 3px solid #ffd700; }
  #leaderboard li:nth-child(2) { border-left: 3px solid #c0c0c0; }
  #leaderboard li:nth-child(3) { border-left: 3px solid #cd7f32; }
  #leaderboard .empty { color: #777; font-style: italic; justify-content: center; }

  .btn-restart {
    padding: 11px 16px; font-size: 0.95rem; border: none; border-radius: 10px;
    background: linear-gradient(90deg, #f9d423, #ff4e50); color: #fff;
    cursor: pointer; font-weight: 600; margin-top: auto;
    box-shadow: 0 4px 12px rgba(255, 78, 80, 0.3);
    transition: transform 0.15s, box-shadow 0.15s;
  }
  .btn-restart:hover { transform: translateY(-2px); box-shadow: 0 6px 18px rgba(255, 78, 80, 0.4); }
  .btn-restart:active { transform: scale(0.98); }

  /* Анимации */
  @keyframes matchPop {
    0% { transform: rotateY(180deg) scale(1); }
    40% { transform: rotateY(180deg) scale(1.12); }
    100% { transform: rotateY(180deg) scale(1); }
  }
  @keyframes noMatch {
    0%, 100% { transform: rotateY(180deg) translateX(0); }
    20% { transform: rotateY(180deg) translateX(-4px); }
    40% { transform: rotateY(180deg) translateX(4px); }
    60% { transform: rotateY(180deg) translateX(-3px); }
    80% { transform: rotateY(180deg) translateX(3px); }
  }
  .card.no-match-anim { animation: noMatch 0.4s ease; }

  .overlay {
    display: none; position: fixed; inset: 0;
    background: rgba(15, 12, 41, 0.85); backdrop-filter: blur(8px);
    z-index: 100; align-items: center; justify-content: center; flex-direction: column; text-align: center;
  }
  .overlay.show { display: flex; animation: fadeIn 0.3s ease; }
  .overlay h2 {
    font-size: 2.2rem; margin-bottom: 8px;
    background: linear-gradient(90deg, #f9d423, #ff4e50);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .overlay p { font-size: 1.1rem; margin-bottom: 20px; color: rgba(255,255,255,0.85); }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

  /* 📱 TABLET */
  @media (max-width: 768px) {
    :root { --sidebar-width: 100%; }
    .wrapper { flex-direction: column; align-items: center; gap: 18px; }
    .game-section { align-items: center; width: 100%; }
    .sidebar { flex-direction: row; align-items: center; justify-content: space-between; padding: 14px; }
    .sidebar h2 { margin: 0; padding: 0; border: none; }
    #leaderboard { flex-direction: row; flex-wrap: wrap; gap: 5px; }
    .btn-restart { margin: 0; padding: 8px 14px; }
    h1 { text-align: center; }
    .stats { justify-content: center; }
  }

  /* 📱 PHONE */
  @media (max-width: 500px) {
    :root {
      --gap: 3px;
      --card-font: clamp(0.85rem, 6.5vw, 1.3rem);
      --radius: 8px;
    }
    .wrapper { gap: 12px; }
    h1 { font-size: 1.3rem; margin-bottom: 6px; }
    .stats { gap: 6px; font-size: 0.8rem; }
    .stats span { padding: 4px 8px; border-radius: 14px; }
    .sidebar { flex-direction: column; padding: 12px; border-radius: 12px; }
    .sidebar h2 { font-size: 0.95rem; margin-bottom: 4px; border-bottom: none; }
    #leaderboard { flex-direction: column; gap: 4px; }
    #leaderboard li { padding: 5px 8px; font-size: 0.8rem; border-radius: 6px; }
    .btn-restart { width: 100%; padding: 10px; font-size: 0.9rem; }
    .card-back::after { font-size: 0.7em; }
    .overlay h2 { font-size: 1.8rem; }
    .overlay p { font-size: 0.95rem; }
  }
</style>
</head>
<body>

<div class="wrapper">
  <main class="game-section">
    <h1>🧠 Memory Game</h1>
    <div class="stats">
      <span>Ходы: <b id="moves">0</b></span>
      <span>Пары: <b id="pairs">0</b> / 28</span>
      <span>Время: <b id="timer">0:00</b></span>
    </div>
    <div class="board" id="board"></div>
  </main>

  <aside class="sidebar">
    <h2>🏆 Рекорды</h2>
    <ol id="leaderboard"><li class="empty">Пока нет рекордов</li></ol>
    <button class="btn-restart" onclick="initGame()">🔄 Новая игра</button>
  </aside>
</div>

<div class="overlay" id="overlay">
  <h2>🎉 Победа!</h2>
  <p id="winText">Вы нашли все пары!</p>
  <button class="btn-restart" onclick="closeOverlay(); initGame();">Играть снова</button>
</div>

<script>
  const emojis = [
    '🍎','🍊','🍋','🍇','🍉','🍓','🫐','🍒',
    '🥝','🍑','🥭','🍍','🥥','🌶️','🍕','🍔',
    '🌮','🍣','🍩','🧁','🎸','🎨','🚀','⚡',
    '🌈','🎯','🦄','🐉'
  ];

  let flippedCards = [];
  let matchedPairs = 0;
  let moves = 0;
  let lockBoard = false;
  let timerInterval = null;
  let seconds = 0;
  let gameStarted = false;

  function shuffle(arr) {
    for (let i = arr.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [arr[i], arr[j]] = [arr[j], arr[i]];
    }
    return arr;
  }

  function formatTime(s) {
    const m = Math.floor(s / 60);
    const sec = s % 60;
    return `${m}:${sec.toString().padStart(2, '0')}`;
  }

  function startTimer() {
    if (gameStarted) return;
    gameStarted = true;
    timerInterval = setInterval(() => {
      seconds++;
      document.getElementById('timer').textContent = formatTime(seconds);
    }, 1000);
  }

  function stopTimer() { clearInterval(timerInterval); }

  // === Логика рекордов ===
  function getRecords() {
    try { return JSON.parse(localStorage.getItem('memoryRecords') || '[]'); } 
    catch { return []; }
  }

  function saveRecord(time) {
    const records = getRecords();
    records.push(time);
    records.sort((a, b) => a - b);
    const top = records.slice(0, 5);
    try { localStorage.setItem('memoryRecords', JSON.stringify(top)); } catch {}
  }

  function renderLeaderboard() {
    const list = document.getElementById('leaderboard');
    const records = getRecords();
    if (!records.length) {
      list.innerHTML = '<li class="empty">Пока нет рекордов</li>';
      return;
    }
    list.innerHTML = records.map((t, i) => {
      const medal = i === 0 ? '🥇' : i === 1 ? '🥈' : i === 2 ? '🥉' : `#${i + 1}`;
      return `<li><span>${medal}</span> <span>${formatTime(t)}</span></li>`;
    }).join('');
  }

  // === Игровая логика ===
  function createCard(emoji, index) {
    const card = document.createElement('div');
    card.classList.add('card');
    card.dataset.emoji = emoji;
    card.dataset.index = index;
    card.innerHTML = `<div class="card-back"></div><div class="card-front">${emoji}</div>`;
    card.addEventListener('click', () => flipCard(card));
    // Touch support
    card.addEventListener('touchend', (e) => { e.preventDefault(); flipCard(card); }, {passive: false});
    return card;
  }

  function flipCard(card) {
    if (lockBoard || card.classList.contains('flipped') || card.classList.contains('matched') || flippedCards.length >= 2) return;

    startTimer();
    card.classList.add('flipped');
    flippedCards.push(card);

    if (flippedCards.length === 2) {
      moves++;
      document.getElementById('moves').textContent = moves;
      checkMatch();
    }
  }

  function checkMatch() {
    const [a, b] = flippedCards;
    const match = a.dataset.emoji === b.dataset.emoji;

    if (match) {
      a.classList.add('matched');
      b.classList.add('matched');
      matchedPairs++;
      document.getElementById('pairs').textContent = matchedPairs;
      flippedCards = [];

      if (matchedPairs === 28) {
        stopTimer();
        saveRecord(seconds);
        renderLeaderboard();
        setTimeout(() => {
          document.getElementById('winText').innerHTML = 
            `Ваше время: <b>${formatTime(seconds)}</b><br>Ходов: ${moves}`;
          document.getElementById('overlay').classList.add('show');
        }, 500);
      }
    } else {
      lockBoard = true;
      setTimeout(() => {
        a.classList.add('no-match-anim');
        b.classList.add('no-match-anim');
      }, 150);

      setTimeout(() => {
        a.classList.remove('flipped', 'no-match-anim');
        b.classList.remove('flipped', 'no-match-anim');
        flippedCards = [];
        lockBoard = false;
      }, 700);
    }
  }

  function closeOverlay() { document.getElementById('overlay').classList.remove('show'); }

  function initGame() {
    stopTimer();
    closeOverlay();

    matchedPairs = 0; moves = 0; seconds = 0; gameStarted = false; flippedCards = []; lockBoard = false;
    document.getElementById('moves').textContent = '0';
    document.getElementById('pairs').textContent = '0';
    document.getElementById('timer').textContent = '0:00';

    const board = document.getElementById('board');
    board.innerHTML = '';

    let deck = [];
    emojis.forEach(e => { deck.push(e); deck.push(e); });
    shuffle(deck);

    deck.forEach((emoji, i) => board.appendChild(createCard(emoji, i)));
  }

  renderLeaderboard();
  initGame();
</script>

</body>
</html>
